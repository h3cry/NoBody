[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
